<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TryMusic 星体资源</title><style>body{font:17px system-ui;max-width:600px;margin:48px auto;padding:20px}a{display:block;padding:14px 0}</style><h1>TryMusic 星体资源</h1><p>无需登录。下载后在应用的“更新与下载”中导入资源包。</p><div id="packs"></div><a href="SOURCES.md">素材与署名</a><script>fetch("channel.json").then(r=>r.json()).then(m=>{for(const p of m.packs){const a=document.createElement("a");a.textContent=p.name+" · "+(p.size/1048576).toFixed(1)+" MB";a.href=p.mirrors[0];document.getElementById("packs").append(a)}})</script>
